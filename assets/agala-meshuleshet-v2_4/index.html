<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>עגלה משולשת</title>
<style>
:root {
  --color-primary:#6750A4; --color-on-primary:#FFFFFF;
  --color-secondary:#625B71; --color-on-secondary:#FFFFFF;
  --color-surface:#FFFBFE; --color-on-surface:#1C1B1F;
  --color-surface-container-highest:#E6E0E9;
  --color-error:#B3261E; --color-on-error:#FFFFFF;
  --color-outline:#79747E;
  --color-primary-subtle:rgba(103,80,164,0.12);
  --color-secondary-subtle:rgba(98,91,113,0.12);
  --font-main:'Frank Ruhl Libre','David',serif;
  --font-size-base:18px; --line-height:1.5;
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-pill:999px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-main);font-size:var(--font-size-base);line-height:var(--line-height);
  background:var(--color-surface);color:var(--color-on-surface);height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* TOP BAR */
#topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 14px;
  border-bottom:1px solid var(--color-outline);background:var(--color-surface);gap:8px;flex-shrink:0;}
#topbar h1{font-size:1rem;font-weight:700;color:var(--color-primary);}
.tool-btn{border:none;background:transparent;cursor:pointer;padding:5px 10px;border-radius:var(--radius-sm);
  color:var(--color-on-surface);font-size:0.82rem;font-family:var(--font-main);transition:background 0.15s;}
.tool-btn:hover{background:var(--color-primary-subtle);}

/* PANELS */
#panels{display:flex;flex:1;overflow:hidden;}
.resizer{width:5px;background:var(--color-outline);opacity:0.3;cursor:col-resize;flex-shrink:0;transition:opacity 0.15s;}
.resizer:hover,.resizer.dragging{opacity:0.8;background:var(--color-primary);}
.panel{display:flex;flex-direction:column;overflow:hidden;flex:1;min-width:80px;}

/* PANEL HEADER */
.panel-header{display:flex;align-items:center;gap:4px;padding:4px 8px;
  border-bottom:1px solid var(--color-outline);background:var(--color-surface-container-highest);flex-shrink:0;}
.panel-title{font-size:0.78rem;font-weight:700;color:var(--color-primary);flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.panel-btn{border:none;background:transparent;cursor:pointer;padding:3px 6px;border-radius:var(--radius-sm);
  color:var(--color-on-surface);font-size:0.72rem;font-family:var(--font-main);transition:background 0.15s;white-space:nowrap;}
.panel-btn:hover{background:var(--color-primary-subtle);}
.panel-content{flex:1;overflow:hidden;position:relative;}

/* EMPTY STATE */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;gap:12px;padding:20px;}
.empty-state .big-icon{font-size:2.2rem;}
.empty-state p{font-size:0.82rem;color:var(--color-outline);text-align:center;}
.choice-btn{border:1px solid var(--color-outline);background:var(--color-surface);
  border-radius:var(--radius-md);padding:9px 14px;cursor:pointer;font-family:var(--font-main);
  font-size:0.83rem;color:var(--color-on-surface);text-align:right;width:100%;max-width:200px;
  transition:background 0.15s,border-color 0.15s;display:flex;align-items:center;gap:8px;}
.choice-btn:hover{background:var(--color-primary-subtle);border-color:var(--color-primary);}

/* PDF */
.pdf-frame{width:100%;height:100%;border:none;display:block;}

/* BOOK SEARCH */
.book-search-wrap{display:flex;flex-direction:column;height:100%;padding:8px;gap:6px;}
.book-search-input{border:1px solid var(--color-outline);border-radius:var(--radius-sm);
  padding:6px 10px;font-family:var(--font-main);font-size:0.85rem;
  background:var(--color-surface);color:var(--color-on-surface);outline:none;width:100%;}
.book-search-input:focus{border-color:var(--color-primary);}
.book-ref-input{border:1px solid var(--color-outline);border-radius:var(--radius-sm);
  padding:5px 10px;font-family:var(--font-main);font-size:0.82rem;
  background:var(--color-surface);color:var(--color-on-surface);outline:none;width:100%;
  display:none;}
.book-ref-input.show{display:block;}
.book-results{flex:1;overflow-y:auto;}
.book-result-item{padding:7px 10px;cursor:pointer;border-radius:var(--radius-sm);
  font-size:0.82rem;transition:background 0.12s;border-bottom:1px solid var(--color-outline);}
.book-result-item:hover{background:var(--color-primary-subtle);color:var(--color-primary);}
.book-hint{font-size:0.75rem;color:var(--color-outline);text-align:center;padding:16px 0;}

/* BOOK OPEN */
.book-open-wrap{display:flex;flex-direction:column;height:100%;}
.book-open-toolbar{padding:6px 10px;border-bottom:1px solid var(--color-outline);
  display:flex;align-items:center;gap:6px;flex-shrink:0;flex-wrap:wrap;}
.book-open-content{flex:1;overflow-y:auto;padding:10px 14px;font-size:0.9rem;line-height:var(--line-height);direction:rtl;}
.book-open-content p{margin-bottom:0.4em;}

/* NOTEPAD */
.notepad-wrap{display:flex;flex-direction:column;height:100%;}
.fmt-bar{display:flex;align-items:center;gap:3px;padding:3px 8px;
  border-bottom:1px solid var(--color-outline);flex-wrap:wrap;flex-shrink:0;}
.fmt-btn{border:none;background:transparent;cursor:pointer;padding:3px 6px;border-radius:var(--radius-sm);
  color:var(--color-on-surface);font-size:0.78rem;font-family:var(--font-main);transition:background 0.15s;}
.fmt-btn:hover{background:var(--color-primary-subtle);}
.fmt-btn.active{background:var(--color-primary-subtle);color:var(--color-primary);font-weight:700;}
.font-sel{border:1px solid var(--color-outline);background:transparent;border-radius:var(--radius-sm);
  padding:2px 4px;font-family:var(--font-main);font-size:0.75rem;color:var(--color-on-surface);cursor:pointer;}
.sep{width:1px;height:18px;background:var(--color-outline);opacity:0.4;margin:0 2px;}
.note-editor{flex:1;outline:none;padding:10px 14px;overflow-y:auto;font-family:var(--font-main);
  font-size:0.95rem;line-height:var(--line-height);color:var(--color-on-surface);
  white-space:pre-wrap;word-break:break-word;}
.note-editor:empty:before{content:attr(data-placeholder);color:var(--color-outline);pointer-events:none;}
.note-footer{padding:3px 10px;font-size:0.68rem;color:var(--color-outline);
  border-top:1px solid var(--color-outline);display:flex;justify-content:space-between;}

/* RECENTS POPOVER */
.recents-pop{position:absolute;top:100%;right:0;min-width:200px;max-width:280px;max-height:260px;
  overflow-y:auto;background:var(--color-surface-container-highest);
  border-radius:var(--radius-md);box-shadow:0 4px 20px rgba(0,0,0,0.15);
  border:1px solid var(--color-outline);z-index:200;
  opacity:0;transform:translateY(-6px) scale(0.97);pointer-events:none;
  transform-origin:top right;transition:opacity 0.15s,transform 0.15s cubic-bezier(0.4,0,0.2,1);}
.recents-pop.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
.recents-pop-item{padding:8px 14px;cursor:pointer;font-size:0.8rem;
  border-bottom:1px solid var(--color-outline);transition:background 0.12s;
  display:flex;align-items:center;gap:6px;}
.recents-pop-item:hover{background:var(--color-primary-subtle);}
.recents-pop-title{padding:6px 14px;font-size:0.7rem;font-weight:700;
  color:var(--color-primary);border-bottom:1px solid var(--color-outline);}
.recents-anchor{position:relative;display:inline-flex;}

/* PANEL DRAG SWAP */
.panel-header{cursor:grab;}
.panel-header.drag-over{outline:2px solid var(--color-primary);}

.panel.focus-mode{position:fixed!important;inset:0;z-index:500;width:100%!important;height:100%!important;}
#panels.has-focus .panel:not(.focus-mode){display:none;}
#panels.has-focus .resizer{display:none;}

#statusbar{display:flex;align-items:center;justify-content:space-between;
  padding:3px 12px;font-size:0.68rem;color:var(--color-outline);
  border-top:1px solid var(--color-outline);background:var(--color-surface);flex-shrink:0;}

/* TOAST */
#toast{position:fixed;bottom:50px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--color-on-surface);color:var(--color-surface);
  padding:7px 16px;border-radius:var(--radius-pill);font-size:0.78rem;
  opacity:0;transition:opacity 0.2s,transform 0.2s;pointer-events:none;z-index:300;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>

<div id="topbar">
  <h1>🛺 עגלה משולשת</h1>
  <div style="display:flex;gap:6px;">
    <button class="tool-btn" onclick="saveScene()">🎬 שמור סצנה</button>
    <button class="tool-btn" onclick="showScenes()">🎬 סצנות</button>
    <button class="tool-btn" onclick="resetAll()">↺ אפס</button>
    <button class="tool-btn" onclick="sendFeedback()">💡 הארות</button>
  </div>
</div>

<div id="panels">
  <div class="panel" id="panel-0">
    <div class="panel-header">
      <span class="panel-title" id="ptitle-0">חלונית א׳</span>
      <div id="pbtns-0" style="display:flex;gap:3px;"></div>
    </div>
    <div class="panel-content" id="pcontent-0"></div>
  </div>
  <div class="resizer" id="resizer-0"></div>
  <div class="panel" id="panel-1">
    <div class="panel-header">
      <span class="panel-title" id="ptitle-1">חלונית ב׳</span>
      <div id="pbtns-1" style="display:flex;gap:3px;"></div>
    </div>
    <div class="panel-content" id="pcontent-1"></div>
  </div>
  <div class="resizer" id="resizer-1"></div>
  <div class="panel" id="panel-2">
    <div class="panel-header">
      <span class="panel-title" id="ptitle-2">חלונית ג׳</span>
      <div id="pbtns-2" style="display:flex;gap:3px;"></div>
    </div>
    <div class="panel-content" id="pcontent-2"></div>
  </div>
</div>

<div id="statusbar">
  <span id="save-status">● לא נשמר</span>
  <span>עגלה משולשת v2.4.0 — נוצר ע״י חד בדרא</span>
  <span id="word-count">0 מילים</span>
</div>
<div id="toast"></div>

<script>
// ── THEME ──────────────────────────────────────────────────
function applyTheme(t){
  if(!t||!t.colorScheme)return;
  const c=t.colorScheme,r=document.documentElement;
  r.style.setProperty('--color-primary',c.primary);
  r.style.setProperty('--color-on-primary',c.onPrimary);
  r.style.setProperty('--color-secondary',c.secondary);
  r.style.setProperty('--color-on-secondary',c.onSecondary);
  r.style.setProperty('--color-surface',c.surface);
  r.style.setProperty('--color-on-surface',c.onSurface);
  r.style.setProperty('--color-surface-container-highest',c.surfaceContainerHighest);
  r.style.setProperty('--color-error',c.error);
  r.style.setProperty('--color-on-error',c.onError);
  r.style.setProperty('--color-outline',c.outline);
  function h(h,a){const x=parseInt(h.slice(1,3),16),y=parseInt(h.slice(3,5),16),z=parseInt(h.slice(5,7),16);return`rgba(${x},${y},${z},${a})`;}
  r.style.setProperty('--color-primary-subtle',h(c.primary,0.12));
  r.style.setProperty('--color-secondary-subtle',h(c.secondary,0.12));
  document.body.classList.toggle('dark-mode',t.mode==='dark');
  if(t.typography){
    r.style.setProperty('--font-main',`'${t.typography.fontFamily}','David',serif`);
    r.style.setProperty('--font-size-base',`${t.typography.fontSize}px`);
    r.style.setProperty('--line-height',String(t.typography.lineHeight));
  }
}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

// ── STATE ──────────────────────────────────────────────────
// docs: {id: {title, html, fontFamily}}
let docs={};
let saveTimer=null;
// recents
let recentPdfs=[];   // [{name}]
let recentBooks=[];  // [{bookId, title, ref}]
let recentDocs=[];   // [docId, ...]

// ── STORAGE ────────────────────────────────────────────────
async function saveAll(){
  try{
    await Otzaria.call('plugin.storage.set',{key:'agala2_docs',value:JSON.stringify(docs)});
    await Otzaria.call('plugin.storage.set',{key:'agala2_recents',value:JSON.stringify({pdfs:recentPdfs,books:recentBooks,docs:recentDocs})});
    await Otzaria.call('plugin.storage.set',{key:'agala2_bookmarks',value:JSON.stringify(bookmarks)});
    await Otzaria.call('plugin.storage.set',{key:'agala2_scenes',value:JSON.stringify(scenes)});
    document.getElementById('save-status').textContent='✓ נשמר';
  }catch(e){document.getElementById('save-status').textContent='⚠ שגיאת שמירה';}
}
function schedSave(){
  document.getElementById('save-status').textContent='● לא נשמר';
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveAll,1500);
}
async function loadAll(){
  try{
    const r1=await Otzaria.call('plugin.storage.get',{key:'agala2_docs'});
    if(r1.success&&r1.data) docs=JSON.parse(r1.data);
    const r2=await Otzaria.call('plugin.storage.get',{key:'agala2_recents'});
    if(r2.success&&r2.data){const d=JSON.parse(r2.data);recentPdfs=d.pdfs||[];recentBooks=d.books||[];recentDocs=d.docs||[];}
    const r3=await Otzaria.call('plugin.storage.get',{key:'agala2_bookmarks'});
    if(r3.success&&r3.data) bookmarks=JSON.parse(r3.data);
    const r4=await Otzaria.call('plugin.storage.get',{key:'agala2_scenes'});
    if(r4.success&&r4.data) scenes=JSON.parse(r4.data);
  }catch(e){}
}

// ── PANEL HEADERS ──────────────────────────────────────────
function setPanelBtns(idx, btns){
  // btns: array of {label, title, onclick}
  const wrap=document.getElementById('pbtns-'+idx);
  wrap.innerHTML='';
  btns.forEach(b=>{
    const btn=document.createElement('button');
    btn.className='panel-btn';
    btn.textContent=b.label;
    btn.title=b.title||'';
    btn.onclick=b.onclick;
    wrap.appendChild(btn);
  });
}

// ── EMPTY STATE ────────────────────────────────────────────
function renderEmpty(idx){
  document.getElementById('ptitle-'+idx).textContent=['חלונית א׳','חלונית ב׳','חלונית ג׳'][idx];
  setPanelBtns(idx,[]);
  document.getElementById('pcontent-'+idx).innerHTML=`
    <div class="empty-state">
      <div class="big-icon">📂</div>
      <p>בחר מה לפתוח</p>
      <button class="choice-btn" onclick="openPdf(${idx})">📄 PDF מקומי</button>
      <button class="choice-btn" onclick="openBookSearch(${idx})">📚 ספר מאוצריא</button>
      <button class="choice-btn" onclick="openNotepad(${idx},null)">✏️ פנקס כתיבה</button>
    </div>`;
}

// ── PDF ────────────────────────────────────────────────────
function openPdf(idx, nameHint){
  const input=document.createElement('input');
  input.type='file'; input.accept='application/pdf';
  input.onchange=e=>{
    const file=e.target.files[0]; if(!file)return;
    const url=URL.createObjectURL(file);
    renderPdf(idx, file.name, url);
    // save to recents (name only)
    recentPdfs=recentPdfs.filter(p=>p.name!==file.name);
    recentPdfs.unshift({name:file.name});
    if(recentPdfs.length>10) recentPdfs.pop();
    schedSave();
  };
  input.click();
}

async function extractPdfText(fromIdx, url, name){
  showToast('מחלץ טקסט…');
  try{
    // configure worker
    if(window.pdfjsLib){
      pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const loadingTask=pdfjsLib.getDocument(url);
      const pdf=await loadingTask.promise;
      let fullText='';
      for(let p=1;p<=pdf.numPages;p++){
        const page=await pdf.getPage(p);
        const content=await page.getTextContent();
        const pageText=content.items.map(i=>i.str).join(' ');
        fullText+=pageText+'\n\n';
      }
      // find or create notepad in another panel
      let targetIdx=-1;
      for(let i=0;i<3;i++){
        if(i===fromIdx)continue;
        if(document.getElementById('editor-'+i)){targetIdx=i;break;}
      }
      if(targetIdx===-1){
        targetIdx=fromIdx===0?1:0;
        openNotepad(targetIdx,null);
        await new Promise(r=>setTimeout(r,50));
      }
      const ed=document.getElementById('editor-'+targetIdx);
      if(!ed){showToast('פתח פנקס בחלונית אחרת תחילה');return;}
      const docId=ed._docId;
      ed.focus();
      // set as content (replace or append)
      const existing=ed.innerText.trim();
      if(existing){
        ed.innerHTML+='\n\n<hr>\n'+fullText.replace(/\n/g,'<br>');
      } else {
        ed.innerHTML=fullText.replace(/\n/g,'<br>');
      }
      if(docId&&docs[docId]) docs[docId].html=ed.innerHTML;
      updateWc(targetIdx);
      schedSave();
      showToast('חולץ '+pdf.numPages+' עמודים ✓');
    } else {
      showToast('PDF.js לא נטען, נסה שנית');
    }
  }catch(e){
    showToast('שגיאה: '+e.message);
  }
}

function renderPdf(idx, name, url){
  document.getElementById('ptitle-'+idx).textContent='📄 '+name;
  setPanelBtns(idx,[
    {label:'📋 חלץ טקסט', title:'חלץ טקסט מה-PDF לפנקס', onclick:()=>extractPdfText(idx,url,name)},
    {label:'🕐 אחרונים', title:'PDF שנפתחו לאחרונה', onclick:()=>showPdfRecents(idx)},
    {label:'📂 פתח', title:'פתח PDF אחר', onclick:()=>openPdf(idx)},
    {label:'✕', title:'סגור', onclick:()=>renderEmpty(idx)}
  ]);
  document.getElementById('pcontent-'+idx).innerHTML=`<iframe class="pdf-frame" src="${url}"></iframe>`;
}

function showPdfRecents(idx){
  toggleRecents('pdf-rec-'+idx, recentPdfs.map(p=>({
    icon:'📄', label:p.name,
    action:()=>{ openPdf(idx); } // can only re-open via file picker
  })), 'PDF אחרונים (לחץ לבחירה מחדש)');
}

// ── BOOK SEARCH ────────────────────────────────────────────
function openBookSearch(idx){
  document.getElementById('ptitle-'+idx).textContent='📚 חיפוש ספר';
  setPanelBtns(idx,[
    {label:'🕐 אחרונים', title:'ספרים שנפתחו לאחרונה', onclick:()=>showBookRecents(idx)},
    {label:'✕', title:'סגור', onclick:()=>renderEmpty(idx)}
  ]);
  document.getElementById('pcontent-'+idx).innerHTML=`
    <div class="book-search-wrap">
      <input class="book-search-input" id="bsearch-${idx}" placeholder="הקלד שם ספר…" autocomplete="off">
      <input class="book-ref-input" id="bref-${idx}" placeholder="מיקום: פרק א, הלכה ג… (אופציונלי)">
      <div id="bopen-${idx}" style="display:none;padding:4px 0;">
        <button class="choice-btn" style="max-width:100%;justify-content:center;" onclick="confirmOpenBook(${idx})">📖 פתח במיקום זה</button>
      </div>
      <div class="book-results" id="bresults-${idx}"><div class="book-hint">טוען…</div></div>
    </div>`;
  const input=document.getElementById('bsearch-'+idx);
  let selBook=null;
  input._selBook=null;
  let timer=null;
  input.addEventListener('input',()=>{
    input._selBook=null;
    document.getElementById('bref-'+idx).classList.remove('show');
    document.getElementById('bopen-'+idx).style.display='none';
    clearTimeout(timer);
    const q=input.value.trim();
    if(!q){showRecentBooks(idx);return;}
    timer=setTimeout(()=>searchBooks(idx,q),250);
  });
  input.focus();
  showRecentBooks(idx);
}

async function showRecentBooks(idx){
  const el=document.getElementById('bresults-'+idx);
  if(!el)return;
  // try listRecentBooks from otzaria
  try{
    const r=await Otzaria.call('library.listRecentBooks');
    const books=(r.data||[]);
    const merged=[...books];
    // add our saved recents not already in list
    recentBooks.forEach(rb=>{if(!merged.find(b=>b.bookId===rb.bookId))merged.push(rb);});
    if(merged.length) return renderBookResults(idx,merged);
  }catch(e){}
  // fallback to our recents
  if(recentBooks.length) return renderBookResults(idx,recentBooks);
  el.innerHTML='<div class="book-hint">הקלד שם ספר לחיפוש</div>';
}

async function searchBooks(idx,q){
  const el=document.getElementById('bresults-'+idx); if(!el)return;
  el.innerHTML='<div class="book-hint">מחפש…</div>';
  try{
    const r=await Otzaria.call('library.findBooks',{query:q,limit:50});
    const books=r.data||[];
    if(!books.length){el.innerHTML='<div class="book-hint">לא נמצאו תוצאות</div>';return;}
    renderBookResults(idx,books);
  }catch(e){el.innerHTML='<div class="book-hint">שגיאה: '+esc(e.message)+'</div>';}
}

function renderBookResults(idx,books){
  const el=document.getElementById('bresults-'+idx); if(!el)return;
  el.innerHTML=books.map(b=>{
    const bid=b.bookId||b.title||'';
    const ttl=b.title||b.bookId||'';
    const sId=bid.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    const sTtl=ttl.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    return `<div class="book-result-item" onclick="pickBook(${idx},'${sId}','${sTtl}')">${esc(ttl)}</div>`;
  }).join('');
}

function pickBook(idx, bookId, title){

async function confirmOpenBook(idx){

async function selectBook(idx,bookId,title,ref){
  document.getElementById('ptitle-'+idx).textContent='📖 '+title;
  setPanelBtns(idx,[
    {label:'🔖 סימניות', title:'סימניות', onclick:()=>showBookmarks(idx,bookId,title)},
    {label:'🕐 אחרונים', title:'ספרים אחרונים', onclick:()=>showBookRecents(idx)},
    {label:'🔍 חיפוש', title:'חזור לחיפוש', onclick:()=>openBookSearch(idx)},
    {label:'✕', title:'סגור', onclick:()=>renderEmpty(idx)}
  ]);
  document.getElementById('pcontent-'+idx).innerHTML=`
    <div class="book-open-wrap">
      <div class="book-open-toolbar">
        <span style="font-size:0.8rem;font-weight:700;color:var(--color-primary);">${esc(title)}</span>
        <input id="bsearch2-${idx}" class="book-search-input" style="width:130px;padding:4px 8px;font-size:0.78rem;"
          placeholder="חפש בתוך הספר…" autocomplete="off">
        <button class="panel-btn" onclick="copySelectionToNotepad(${idx})" title="העתק סימון לפנקס">📋→✏️</button>
        <button class="panel-btn" onclick="addBookmark(${idx},'${bookId.replace(/'/g,"\\'")}','${title.replace(/'/g,"\\'")}')">🔖+</button>
      </div>
      <div class="book-open-content" id="bcontent-${idx}"><div class="book-hint">טוען…</div></div>
    </div>`;

  // save to recents
  recentBooks=recentBooks.filter(b=>b.bookId!==bookId);
  recentBooks.unshift({bookId,title,ref});
  if(recentBooks.length>10) recentBooks.pop();
  recordPanelState(idx,'book',{bookId,title,ref});
  schedSave();

  // load content inside panel
  const bcEl=document.getElementById('bcontent-'+idx);
  try{
    // load TOC first to support ref navigation
    let startOffset=0;
    if(ref){
      try{
        const toc=await Otzaria.call('library.getBookToc',{bookId});
        if(toc.success&&toc.data){
          const entry=toc.data.find(e=>e.text&&e.text.includes(ref));
          if(entry) startOffset=entry.index||0;
        }
      }catch(e){}
    }
    const rc=await Otzaria.call('library.getBookContent',{bookId,offset:startOffset,limit:5000});
    const text=(rc.success&&rc.data)||'';
    if(!bcEl)return;
    if(!text){bcEl.innerHTML='<div class="book-hint">לא נמצא תוכן לספר זה</div>';return;}
    bcEl.innerHTML=text.split('\n').filter(l=>l.trim()).map(l=>`<p>${esc(l)}</p>`).join('');
    showToast('הספר נטען ✓');
    // in-panel search
    const s2=document.getElementById('bsearch2-'+idx);
    if(s2) s2.addEventListener('input',()=>highlightInPanel(idx,s2.value.trim()));
  }catch(e){
    if(bcEl) bcEl.innerHTML='<div class="book-hint">שגיאה בטעינת הספר: '+esc(e.message)+'</div>';
  }
}

function copySelectionToNotepad(fromIdx){
  const sel=window.getSelection();
  const text=sel?sel.toString().trim():'';
  if(!text){showToast('סמן טקסט בספר תחילה');return;}
  // find a notepad panel or create one
  let targetIdx=-1;
  for(let i=0;i<3;i++){
    if(i===fromIdx)continue;
    const ed=document.getElementById('editor-'+i);
    if(ed){targetIdx=i;break;}
  }
  if(targetIdx===-1){
    // open notepad in another panel
    targetIdx=fromIdx===0?1:0;
    openNotepad(targetIdx,null);
  }
  const ed=document.getElementById('editor-'+targetIdx);
  if(!ed)return;
  ed.focus();
  document.execCommand('insertText',false,'\n'+text+'\n');
  showToast('הועתק לפנקס ✓');
}

function highlightInPanel(idx,q){
  const el=document.getElementById('bcontent-'+idx); if(!el)return;
  // remove old highlights
  el.querySelectorAll('mark').forEach(m=>{m.replaceWith(m.textContent);});
  if(!q)return;
  // simple text highlight
  el.querySelectorAll('p').forEach(p=>{
    if(p.textContent.includes(q)){
      p.innerHTML=p.textContent.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'),`<mark style="background:var(--color-primary-subtle);color:var(--color-primary);">${esc(q)}</mark>`);
      p.scrollIntoView({block:'nearest'});
    }
  });
}

}

function fmt2(docId,idx,cmd,val){
  const ed=document.getElementById('editor-'+idx); if(!ed)return;

}
function setFontSize2(idx,val){

function setFF(docId,idx,val){
  const ed=document.getElementById('editor-'+idx); if(!ed)return;

}
function updateWc(idx){
  const ed=document.getElementById('editor-'+idx);
  const wc=document.getElementById('wc-'+idx);
  if(!ed||!wc)return;
  const txt=ed.innerText||'';
  const n=txt.trim()===''?0:txt.trim().split(/\s+/).length;

function showDocRecents(idx){

function expMd(idx){
  const ed=document.getElementById('editor-'+idx); if(!ed)return;
  const titleInp=document.getElementById('dtitle-'+idx);
  const docTitle=(titleInp&&titleInp.value)||'פנקס';
  // simple HTML→Markdown
  let md=ed.innerHTML
    .replace(/<h1[^>]*>(.*?)<\/h1>/gi,'# $1\n')
    .replace(/<h2[^>]*>(.*?)<\/h2>/gi,'## $1\n')
    .replace(/<h3[^>]*>(.*?)<\/h3>/gi,'### $1\n')
    .replace(/<strong[^>]*>(.*?)<\/strong>/gi,'**$1**')
    .replace(/<b[^>]*>(.*?)<\/b>/gi,'**$1**')
    .replace(/<em[^>]*>(.*?)<\/em>/gi,'*$1*')
    .replace(/<i[^>]*>(.*?)<\/i>/gi,'*$1*')
    .replace(/<u[^>]*>(.*?)<\/u>/gi,'<u>$1</u>')
    .replace(/<li[^>]*>(.*?)<\/li>/gi,'- $1\n')
    .replace(/<br\s*\/?>/gi,'\n')
    .replace(/<p[^>]*>(.*?)<\/p>/gi,'$1\n')
    .replace(/<[^>]+>/g,'')
    .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&nbsp;/g,' ');
  const b=new Blob([md],{type:'text/markdown;charset=utf-8'});
  dl(b,docTitle+'.md'); showToast('נשמר כ-MD ✓');
}
function expTxt(idx){
  const ed=document.getElementById('editor-'+idx); if(!ed)return;
  const b=new Blob([ed.innerText||''],{type:'text/plain;charset=utf-8'});
  dl(b,'פנקס.txt'); showToast('נשמר כ-TXT ✓');
}
function expPdf(idx){
  const ed=document.getElementById('editor-'+idx); if(!ed)return;
  const w=window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="UTF-8">

    </head><body>${ed.innerHTML}</body></html>`);
  w.document.close();w.focus();setTimeout(()=>{w.print();w.close();},400);
  showToast('פתוח לשמירה כ-PDF ✓');
}
function dl(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();URL.revokeObjectURL(a.href);}

// ── EXPORT WORD ────────────────────────────────────────────
function expWord(idx){
  const ed=document.getElementById('editor-'+idx); if(!ed)return;
  // get title from the doc
  const titleInp=document.getElementById('dtitle-'+idx);
  const docTitle=(titleInp&&titleInp.value)||'פנקס';

  // Build RTF-based .doc — universally opened by Word/LibreOffice
  // We use a simple HTML→Word approach via Blob with Word-compatible MIME
  const html=`<html xmlns:o='urn:schemas-microsoft-com:office:office'
    xmlns:w='urn:schemas-microsoft-com:office:word'
    xmlns='http://www.w3.org/TR/REC-html40'>
<head>
<meta charset='UTF-8'>
<meta name=ProgId content=Word.Document>
<meta name=Generator content='Microsoft Word 11'>
<!--[if gte mso 9]><xml><w:WordDocument>
  <w:View>Print</w:View>
  <w:Zoom>100</w:Zoom>
  <w:BiDi/></w:WordDocument></xml><![endif]-->
<style>
  body{font-family:'David',serif;font-size:12pt;direction:rtl;mso-bidi-language:HE;}
  p{margin:0 0 6pt 0;}

</style>
</head>
<body dir="rtl">
<div dir="rtl">${ed.innerHTML}</div>

}

// ── RECENTS POPOVER ────────────────────────────────────────
let openRecPop=null;
function toggleRecents(id, items, title){
  // close any open
  if(openRecPop&&openRecPop!==id){
    const old=document.getElementById(openRecPop);
    if(old) old.classList.remove('open');
  }
  let pop=document.getElementById(id);
  if(pop){pop.classList.toggle('open');openRecPop=pop.classList.contains('open')?id:null;return;}
  // create
  const anchor=event.currentTarget||event.target;
  const wrap=anchor.closest('.panel-header');
  pop=document.createElement('div');
  pop.id=id; pop.className='recents-pop';
  pop.style.position='absolute';
  pop.innerHTML=`<div class="recents-pop-title">${esc(title)}</div>`+
    (items.length?items.map((it,i)=>`<div class="recents-pop-item" data-i="${i}"><span>${it.icon}</span><span>${esc(it.label)}</span></div>`).join('')
    :'<div class="book-hint">אין פריטים</div>');
  wrap.style.position='relative';
  wrap.appendChild(pop);
  setTimeout(()=>pop.classList.add('open'),10);
  openRecPop=id;
  pop.querySelectorAll('.recents-pop-item').forEach((el,i)=>{
    el.onclick=()=>{pop.classList.remove('open');items[i].action();};
  });
  document.addEventListener('click',function h(e){
    if(!pop.contains(e.target)&&e.target!==anchor){pop.classList.remove('open');document.removeEventListener('click',h);}
  });
}

function toggleFindReplace(idx){
  const bar=document.getElementById('fr-bar-'+idx);
  if(!bar)return;
  const visible=bar.style.display==='flex';
  bar.style.display=visible?'none':'flex';
  if(!visible) document.getElementById('fr-find-'+idx).focus();
}
function frReplace(idx,all){
  const ed=document.getElementById('editor-'+idx); if(!ed)return;
  const find=document.getElementById('fr-find-'+idx).value;
  const repl=document.getElementById('fr-repl-'+idx).value;
  if(!find)return;
  ed.focus();
  if(all){
    ed.innerHTML=ed.innerHTML.replace(new RegExp(find.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'),repl);
    showToast('הוחלף הכל ✓');
  } else {
    document.execCommand('insertText',false,''); // focus
    const sel=window.getSelection();
    const range=document.createRange();
    range.selectNodeContents(ed);
    // find first occurrence using TreeWalker
    const walker=document.createTreeWalker(ed,NodeFilter.SHOW_TEXT);
    let node;
    while((node=walker.nextNode())){
      const i=node.textContent.indexOf(find);
      if(i>=0){
        range.setStart(node,i);
        range.setEnd(node,i+find.length);
        sel.removeAllRanges();sel.addRange(range);
        document.execCommand('insertText',false,repl);
        showToast('הוחלף ✓');
        return;
      }
    }
    showToast('לא נמצא');
  }
}

function toggleFocus(idx){
  const panel=document.getElementById('panel-'+idx);
  const panels=document.getElementById('panels');
  const on=panel.classList.toggle('focus-mode');
  panels.classList.toggle('has-focus',on);
  showToast(on?'מצב מיקוד — לחץ שוב לצאת':'יצאת ממצב מיקוד');
}

let scenes=[];
let panelState=[null,null,null]; // {type:'pdf'|'book'|'notepad', data:{...}}

function recordPanelState(idx,type,data){panelState[idx]={type,data};}

function saveScene(){
  const name=prompt('שם לסצנה:','סצנה '+(scenes.length+1));
  if(!name)return;
  scenes.push({name,panels:JSON.parse(JSON.stringify(panelState))});
  schedSave();
  showToast('סצנה נשמרה ✓');
}

function loadScene(scene){
  scene.panels.forEach((ps,idx)=>{
    if(!ps){renderEmpty(idx);return;}
    if(ps.type==='book') selectBook(idx,ps.data.bookId,ps.data.title,ps.data.ref||'');
    else if(ps.type==='notepad') openNotepad(idx,ps.data.docId);
    else if(ps.type==='pdf') renderEmpty(idx); // PDF needs re-pick
  });
  showToast('סצנה נטענה ✓');
}

function showScenes(){
  if(!scenes.length){showToast('אין סצנות שמורות');return;}
  const items=scenes.map((s,i)=>({icon:'🎬',label:s.name,action:()=>loadScene(s)}));
  toggleRecents('scenes-pop',items,'סצנות שמורות');
}

// ── RESIZERS ───────────────────────────────────────────────
function initResizer(rid,lid,rightId){
  const rs=document.getElementById(rid);
  const lp=document.getElementById(lid);
  const rp=document.getElementById(rightId);
  let sx,sl,sr;
  rs.addEventListener('mousedown',e=>{
    sx=e.clientX;sl=lp.getBoundingClientRect().width;sr=rp.getBoundingClientRect().width;
    rs.classList.add('dragging');
    document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
  });
  function mv(e){
    const dx=sx-e.clientX;
    lp.style.flex='none';lp.style.width=Math.max(80,sl-dx)+'px';
    rp.style.flex='none';rp.style.width=Math.max(80,sr+dx)+'px';
  }
  function up(){rs.classList.remove('dragging');document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);}
}
initResizer('resizer-0','panel-0','panel-1');
initResizer('resizer-1','panel-1','panel-2');
initPanelSwap();

function initPanelSwap(){
  let dragSrc=null;
  [0,1,2].forEach(idx=>{
    const hdr=document.querySelector('#panel-'+idx+' .panel-header');
    hdr.draggable=true;
    hdr.addEventListener('dragstart',e=>{dragSrc=idx;e.dataTransfer.effectAllowed='move';});
    hdr.addEventListener('dragover',e=>{e.preventDefault();hdr.classList.add('drag-over');});
    hdr.addEventListener('dragleave',()=>hdr.classList.remove('drag-over'));
    hdr.addEventListener('drop',e=>{
      e.preventDefault();hdr.classList.remove('drag-over');
      if(dragSrc===null||dragSrc===idx)return;
      swapPanels(dragSrc,idx);
      dragSrc=null;
    });
  });
}

function swapPanels(a,b){
  const pa=document.getElementById('panel-'+a);
  const pb=document.getElementById('panel-'+b);
  // swap innerHTML of title, btns, content
  const selectors=['panel-title','pbtns-','pcontent-'];
  ['ptitle-','pbtns-','pcontent-'].forEach(pre=>{
    const ea=document.getElementById(pre+a);
    const eb=document.getElementById(pre+b);
    const tmp=ea.innerHTML; ea.innerHTML=eb.innerHTML; eb.innerHTML=tmp;
  });
  // swap panelState
  const tmp=panelState[a]; panelState[a]=panelState[b]; panelState[b]=tmp;
  showToast('חלוניות הוחלפו ✓');
}
