name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Validate, publish & release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The validator zips the plugin folder as-is; it does not run the build.
      # `npm run release` runs validate-data + Vite build and assembles the final
      # plugin folder (manifest.json + icon/ + index.html + assets/ + data/) in dist/.
      - name: Build plugin (Vite -> dist/)
        run: npm run release

      # Official Otzaria action: validates, packages .otzplugin, and publishes
      # to the store. Plugin is identified by manifest.id; version must increase.
      - name: Validate, package & publish to otzaria.org
        id: otzaria
        uses: Otzaria/otzaria-plugin-validator@v1
        with:
          path: dist
          otzaria-user: ${{ secrets.OTZARIA_USER }}
          otzaria-password: ${{ secrets.OTZARIA_PASSWORD }}

      - name: Determine version and tag
        id: meta
        run: |
          version="$(node -p "require('./manifest.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version in manifest.json: '$version' (expected X.Y.Z)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version"   >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: release_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists - skipping create"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG does not exist yet"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.release_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ steps.otzaria.outputs.plugin-file }}
          body: |
            ## עיון ההלכה — ${{ steps.meta.outputs.tag }}

            תוסף אוצריא לניהול הספקי עיון ההלכה, צפייה בשאלות, כתיבת תשובות, עיון במקורות וייצוא ל-Word.

            ### התקנה
            הורד את קובץ ה-`.otzplugin` למטה, ובאוצריא:
            **כלים → 🧩 תוספים → ⊕ התקן תוסף חדש**, ובחר את הקובץ.

            ### Checksum
            ```
            SHA-256: ${{ steps.otzaria.outputs.sha256 }}
            ```
